name: Release Hariku Core

# Trigger: push a tag like `v2.3.0` (git push origin v2.3.0), or run manually.
# Everything else — version stamping, compiling, installer, hashing, publishing —
# happens automatically. Source stays in THIS private repo; only the installer +
# version.json are pushed to the PUBLIC distribution repo (InfiArtt/hariku).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.3.0 (no leading v)"
        required: true

concurrency:
  group: hariku-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DIST_REPO: InfiArtt/hariku          # public repo that hosts Pages + Releases
  INSTALLER: Output/HarikuV2-Setup.exe

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine version (from tag or manual input)
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing Hariku $V"

      - name: Verify DIST_TOKEN can reach the dist repo (fail fast)
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DIST_TOKEN secret is empty/unset. Run:  gh secret set DIST_TOKEN --repo InfiArtt/hariku-core  and paste the fine-grained PAT when prompted."
            exit 1
          fi
          if ! gh api "repos/${{ env.DIST_REPO }}" --jq .full_name >/dev/null 2>&1; then
            echo "::error::DIST_TOKEN cannot access ${{ env.DIST_REPO }}. Check the fine-grained PAT has Contents: Read/Write on that repo, and that the InfiArtt org has approved the token."
            exit 1
          fi
          echo "DIST_TOKEN verified for ${{ env.DIST_REPO }}."

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stamp version into constants.py and file.iss
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content core/constants.py) -replace 'CORE_VERSION\s*=\s*".*"', ('CORE_VERSION = "' + $v + '"') | Set-Content core/constants.py -Encoding utf8
          (Get-Content file.iss)         -replace 'AppVersion=.*',            ('AppVersion=' + $v)          | Set-Content file.iss -Encoding utf8
          Write-Host "Stamped version $v"

      - name: Compile with Nuitka
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --windows-console-mode=disable
          --include-package-data=cytolk --include-package=cryptography
          --include-data-dir=sounds=sounds
          --include-data-dir=locales=locales
          --include-data-dir=docs=docs
          --include-data-file=nvdaControllerClient64.dll=nvdaControllerClient64.dll
          --include-data-file=SAAPI64.dll=SAAPI64.dll
          --lto=yes hariku.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" file.iss
          if (-not (Test-Path "${{ env.INSTALLER }}")) { throw "Installer not found at ${{ env.INSTALLER }}" }

      - name: Hash installer and build version.json
        id: meta
        shell: pwsh
        run: |
          $v   = "${{ steps.ver.outputs.version }}"
          $sha = (Get-FileHash "${{ env.INSTALLER }}" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $sha"
          $manifest = [ordered]@{
            latest_version       = $v
            min_version_required = "2.0.0"
            update_type          = "optional"
            force_update         = $false
            download_url         = "https://github.com/${{ env.DIST_REPO }}/releases/download/v$v/HarikuV2-Setup.exe"
            sha256               = $sha
            release_notes        = "Hariku $v"
          }
          $manifest | ConvertTo-Json | Set-Content -Path version.json -Encoding utf8

      - name: Publish release + version.json to the public dist repo
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}   # fine-grained PAT: Contents R/W on InfiArtt/hariku
        shell: bash
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"
          # 1) Release with the installer (create, or reuse+clobber if the tag already exists)
          gh release create "v$v" "${{ env.INSTALLER }}" \
            --repo "${{ env.DIST_REPO }}" --title "Hariku $v" --notes "Automated release $v" \
          || gh release upload "v$v" "${{ env.INSTALLER }}" --repo "${{ env.DIST_REPO }}" --clobber
          # 2) Publish version.json to GitHub Pages (public repo, main branch)
          content=$(base64 -w0 version.json)
          sha=$(gh api "repos/${{ env.DIST_REPO }}/contents/update/version.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${{ env.DIST_REPO }}/contents/update/version.json" \
              -f message="Release $v" -f content="$content" -f sha="$sha" -f branch=main
          else
            gh api --method PUT "repos/${{ env.DIST_REPO }}/contents/update/version.json" \
              -f message="Release $v" -f content="$content" -f branch=main
          fi
          echo "Published Hariku $v"
