name: Tests

# Runs the whole suite in two jobs at once:
#   - tests: everything without windows, in parallel on all the runner's
#     cores (pytest-xdist);
#   - windows: the real-window checks that open Hariku windows and dialogs,
#     one at a time, since windows opened together would take each other's
#     focus. They are skipped on developers' own computers (they steal focus
#     and the screen reader announces them), so they run here instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (in parallel)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests without windows
        run: python -m pytest -q -n auto -m "not window"

  windows:
    name: Real-window checks
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the real-window checks
        env:
          HARIKU_UI_TESTS: "1"
        run: python -m pytest -q -m window
