name: Tests

# Runs the whole suite, including the real-window checks that open Hariku
# windows and dialogs. Those are skipped on developers' own computers (they
# steal focus and the screen reader announces them), so they run here instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests, including real-window checks
        env:
          HARIKU_UI_TESTS: "1"
        run: python -m pytest -q
